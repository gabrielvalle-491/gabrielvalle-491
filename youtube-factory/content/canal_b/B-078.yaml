  exactitud: "medio — rutas de menú en español (Inicio, Formato condicional, Nueva regla) tomadas de la ayuda de Microsoft; confirmar en Excel en español. Las fórmulas deben probarse con fechas reales (formato de fecha, no texto) antes de publicar."
  monetizacion: "bajo"
recursos:
