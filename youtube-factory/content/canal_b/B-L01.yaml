  - calculo: "24 * 26 ** 2 + 6 * 26 + 4"
    resultado: 16384
    respalda: "XFD es la columna número 16 384: X=24, F=6 y D=4 en base 26."
  - calculo: "18400 + 6200 + 4750 + 9300 + 12000 + 2850 + 7500"
    resultado: 61000
    respalda: "Total de la semana de ejemplo (C2:C8)."
