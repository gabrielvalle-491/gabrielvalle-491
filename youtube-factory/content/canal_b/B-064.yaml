  - narracion: "Excel: varias personas editan a la vez si el libro está en OneDrive o SharePoint Online, con AutoSave activado. Sheets: compartes por correo o enlace, das permiso para ver, comentar o editar, y todos editan en vivo. Elige según dónde vive el archivo y qué usa tu equipo."
    visual:
