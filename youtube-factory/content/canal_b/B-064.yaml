    titulo: "Collaborate on Excel workbooks at the same time with co-authoring (Microsoft Support)"
    fecha_consulta: 2026-10-11
    respalda: "La coautoría en Excel requiere que el libro esté en OneDrive, OneDrive for Business o SharePoint Online; AutoSave está activado por defecto en esas ubicaciones; SharePoint local no admite coautoría."
  - url: "https://support.microsoft.com/en-US/Excel/get-started/best-practices-for-coauthoring-in-excel"
    titulo: "Best Practices for Coauthoring in Excel (Microsoft Support)"
    fecha_consulta: 2026-10-11
    respalda: "Si una persona abre el archivo con una versión de Excel sin soporte de coautoría, el resto puede recibir un error de archivo bloqueado."
