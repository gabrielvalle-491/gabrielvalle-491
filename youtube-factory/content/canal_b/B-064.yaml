    titulo: "Collaborate in Sheets (Google Docs Editors Help)"
    fecha_consulta: 2026-10-11
    respalda: "En Sheets se comparte el archivo, se elige el nivel de acceso (ver, comentar o editar) y la colaboración en tiempo real está disponible para hojas de cálculo."
