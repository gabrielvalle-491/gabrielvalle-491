  - narracion: "Primero, dónde se guarda: en la nube de Microsoft o en Google Drive. Segundo, qué permiso necesita cada persona. Tercero, la versión de Excel: si alguien abre el archivo con una versión sin coautoría, Microsoft indica que el resto puede ver un error de bloqueo."
