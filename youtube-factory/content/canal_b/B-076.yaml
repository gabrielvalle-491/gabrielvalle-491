descripcion: |
  VisiCalc fue creada por Dan Bricklin y Bob Frankston, publicada en 1979 para el Apple II y considerada la primera hoja de cálculo para computadoras personales (no la primera idea de hoja de cálculo electrónica).
  Datos de fuentes históricas secundarias; las fechas exactas varían según la fuente.
