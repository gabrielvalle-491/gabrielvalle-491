  - narracion: "En la primavera de 1978, Dan Bricklin, estudiante de MBA en Harvard, creó un prototipo. Ese otoño se unió a Bob Frankston para desarrollar el programa. En 1979, Software Arts lo creó y Personal Software lo publicó para el Apple II."
