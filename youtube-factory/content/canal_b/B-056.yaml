id: B-056
canal: canal_b
fecha: 2026-12-13
formato: short
serie: Funciones de Sheets
episodio: "#02"
pilar: excel_vs_sheets
tipo_editorial: herramienta
idea: "En Google Sheets, el botón Compartir permite elegir el rol de cada persona: lector, comentarista o editor. Darle solo el rol necesario ayuda a no perder el control del archivo."
objetivo: "Enseñar los tres roles y una advertencia sobre descargar, imprimir y copiar, para que la persona comparta con criterio."
publico: "Personas que comparten hojas de cálculo con clientes, equipos o familia."
hipotesis: "Formato 'herramienta' en pilar 'excel_vs_sheets': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje)."
gancho: "No todos necesitan ser editores de tu hoja de cálculo."
duracion_objetivo: "35-55 s (≈85-140 palabras)"
titulo: "Compartir en Google Sheets: lector, comentarista o editor"
titulos_alternativos:
  - "Cómo compartir una hoja sin que te la modifiquen"
  - "Permisos de Google Sheets: qué puede hacer cada rol"
  - "Antes de compartir tu planilla, revisa este permiso"
criterio_titulo: "Nombra los tres roles que la gente busca y anticipa el beneficio (control del archivo)."
descripcion: |
  En Google Sheets puedes compartir con tres roles: lector (solo ve), comentarista (ve y comenta, sin cambiar el contenido) y editor (modifica). Elige el mínimo necesario.
  Según la ayuda de Google, el propietario también puede decidir si lectores y comentaristas pueden descargar, imprimir y copiar el archivo. Los menús pueden variar según tu cuenta.
cta: "Revisa los permisos de tu último archivo compartido."
comentario_fijado: "Ruta general: botón Compartir > agrega a la persona o elige acceso con enlace > elige el rol. Revisa también la configuración para descargar, imprimir y copiar."
hashtags: ["#GoogleSheets", "#Productividad", "#Colaboración"]
palabras_clave: ["compartir Google Sheets", "permisos lector comentarista editor", "proteger hoja de cálculo"]
escenas:
  - narracion: "No todos necesitan ser editores de tu hoja de cálculo."
    visual:
      plantilla: hook
      datos: {kicker: "Funciones de Sheets", titulo: "¿Lector, comentarista o *editor*?", sub: "Comparte sin perder el control"}
  - narracion: "En Google Sheets, presiona Compartir. Agrega a la persona o crea un enlace. Y elige el rol."
    visual:
      plantilla: pasos
      datos:
        titulo: "Cómo compartir"
        pasos:
          - {titulo: "Presiona Compartir", detalle: "botón de compartir de la hoja"}
          - {titulo: "Agrega personas o usa el enlace", detalle: "correo o acceso con enlace"}
          - {titulo: "Elige el rol", detalle: "lector, comentarista o editor"}
  - narracion: "El lector solo mira. El comentarista deja comentarios, sin cambiar el contenido. El editor puede modificarlo todo."
    visual:
      plantilla: lista
      datos:
        titulo: "Tres roles"
        items:
          - {texto: "Lector", detalle: "solo ve el archivo"}
          - {texto: "Comentarista", detalle: "comenta, no cambia el contenido"}
          - {texto: "Editor", detalle: "puede hacer cambios"}
  - narracion: "Y revisa en la configuración si lectores y comentaristas pueden descargar, imprimir y copiar."
    visual:
      plantilla: cierre
      datos:
        titulo: "Da el *mínimo* permiso necesario"
        puntos: ["Lector si solo debe ver", "Comentarista para revisar", "Editor solo si debe cambiar datos"]
        cta: "Revisa tus permisos"
