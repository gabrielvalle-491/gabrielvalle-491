  - url: "https://support.microsoft.com/es-es/Excel/get-started/create-a-pivottable-to-analyze-worksheet-data"
    titulo: "Crear una tabla dinámica para analizar datos de una hoja de cálculo (Microsoft Support)"
    fecha_consulta: 2026-10-11
