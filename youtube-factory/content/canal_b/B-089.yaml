id: B-089
canal: canal_b
fecha: 2027-01-15
formato: short
serie: Mini sistema
episodio: "#17"
pilar: trabajo
tipo_editorial: tutorial
idea: "En una tabla dinámica, el campo de fechas se puede agrupar por meses con clic derecho > Agrupar, para ver las ventas mes a mes en lugar de día por día."
objetivo: "Tutorial rápido para pasar de una lista de ventas diarias a un resumen mensual con una tabla dinámica."
publico: "Personas con listas de ventas por fecha que necesitan totales mensuales en Excel."
hipotesis: "Formato 'tutorial' en pilar 'trabajo': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje)."
gancho: "Tus ventas diarias, convertidas en totales por mes en segundos."
duracion_objetivo: "35-55 s (≈85-140 palabras)"
titulo: "Tabla dinámica: agrupar ventas por mes en Excel"
titulos_alternativos:
  - "Cómo agrupar fechas por mes en una tabla dinámica"
  - "De ventas diarias a totales mensuales sin fórmulas"
  - "Tabla dinámica por mes: clic derecho y Agrupar"
criterio_titulo: "Nombra el problema exacto (agrupar fechas por mes) y la herramienta, que es lo que se busca."
descripcion: |
  Si tu tabla dinámica muestra cada fecha por separado, puedes agruparlas: clic derecho sobre una fecha, Agrupar y elegir Meses. Si tus datos abarcan más de un año, elige también Años para no mezclar el mismo mes de años distintos.
  Los datos del ejemplo son ilustrativos. Los nombres de menú pueden variar según tu versión de Excel; si Agrupar no aparece, revisa que la columna tenga fechas reales.
cta: "Pruébalo con tus propias ventas diarias."
comentario_fijado: "Ruta: en la tabla dinámica, clic derecho sobre una fecha > Agrupar > elige Meses (y Años si hay más de un año) > Aceptar. Para deshacerlo: clic derecho > Desagrupar."
hashtags: ["#Excel", "#TablaDinámica", "#Ventas"]
palabras_clave: ["tabla dinámica agrupar por mes", "agrupar fechas excel", "ventas mensuales excel"]
escenas:
  - narracion: "Tus ventas diarias, convertidas en totales por mes en segundos."
    visual:
      plantilla: hook
      datos: {kicker: "Mini sistema", titulo: "Ventas *por mes* en una tabla dinámica"}
  - narracion: "Primero, crea la tabla dinámica con la fecha en Filas y la venta en Valores. Segundo, haz clic derecho sobre una fecha y elige Agrupar. Tercero, marca Meses y acepta."
    visual:
      plantilla: pasos
      datos:
        titulo: "Tres pasos"
        pasos:
          - {titulo: "Fecha en Filas, venta en Valores", detalle: "en la tabla dinámica"}
          - {titulo: "Clic derecho en una fecha", detalle: "elige Agrupar"}
          - {titulo: "Marca Meses y acepta", detalle: "se agrupa por mes"}
  - narracion: "Y cada fila pasa de ser un día a ser un mes. Aquí, enero, febrero y marzo."
    visual:
      plantilla: barras
      datos:
        titulo: "Ventas por mes (ilustrativo)"
        prefijo: "$ "
        items:
          - {etiqueta: "Enero", valor: 400}
          - {etiqueta: "Febrero", valor: 350}
          - {etiqueta: "Marzo", valor: 500, destacado: true}
        nota: "Datos ilustrativos"
  - narracion: "Si tus datos abarcan más de un año, marca también Años. Así no se mezclan los meses iguales de años distintos."
    visual:
      plantilla: texto
      datos: {kicker: "Ojo", titulo: "Más de un año: marca *Años* también", texto: "Si no, enero de un año se suma con enero del siguiente."}
  - narracion: "Si Agrupar no aparece, revisa que la columna tenga fechas reales."
    visual:
      plantilla: cierre
      datos:
        titulo: "De días a *meses*"
        puntos: ["Clic derecho → Agrupar", "Marca Meses (y Años)", "Revisa que sean fechas reales"]
        cta: "Pruébalo"
fuentes:
