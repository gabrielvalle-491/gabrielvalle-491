  - url: "https://support.microsoft.com/es-es/office/funci%C3%B3n-contar-si-conjunto-dda3dc6e-f74e-4aee-88bc-aa8c2a866842"
    titulo: "CONTAR.SI.CONJUNTO (Microsoft Support)"
    fecha_consulta: 2026-10-11
