    fecha_consulta: 2026-10-11
    respalda: "NETWORKDAYS cuenta días laborables entre dos fechas; su equivalente en Excel en español es DIAS.LAB (equivalencia confirmada por fuentes secundarias en la búsqueda)."
  - url: "https://professor-excel.com/dictionary-for-excel-formulas"
