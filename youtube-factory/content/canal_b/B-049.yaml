id: B-049
canal: canal_b
fecha: 2026-12-06
formato: short
serie: Excel bilingüe
episodio: "#01"
pilar: formulas
tipo_editorial: tutorial
idea: "Las funciones de Excel tienen nombre distinto en inglés y en español (VLOOKUP es BUSCARV); conocer las equivalencias, FALSE/FALSO y el separador de argumentos evita errores al trabajar con archivos de EE. UU."
objetivo: "Tutorial buscable para quien trabaja con equipos o archivos en inglés y español; aporta una tabla de equivalencias y tres detalles que rompen fórmulas."
publico: "Personas en Latinoamérica que reciben archivos de Excel de clientes o empresas de EE. UU., o que siguen tutoriales en inglés."
hipotesis: "Formato 'tutorial' en pilar 'formulas': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje)."
gancho: "VLOOKUP y BUSCARV son la misma función. Cambia el idioma, no la lógica."
duracion_objetivo: "35-55 s (≈85-140 palabras)"
titulo: "VLOOKUP es BUSCARV: nombres de funciones en inglés y español"
titulos_alternativos:
  - "Excel en inglés vs español: 3 funciones y 3 trampas"
  - "Si trabajas con archivos de EE. UU., aprende estas equivalencias"
  - "FALSE no es FALSO: la trampa al copiar fórmulas entre idiomas"
criterio_titulo: "Usa la búsqueda real (VLOOKUP / BUSCARV) y promete una guía de equivalencias, que es lo que se entrega."
descripcion: |
  VLOOKUP, COUNTIFS y NETWORKDAYS son BUSCARV, CONTAR.SI.CONJUNTO y DIAS.LAB en Excel en español. También cambian FALSE por FALSO y, según tu configuración regional, la coma por el punto y coma.
  Excel suele mostrar las fórmulas con los nombres de tu idioma; si copias una fórmula de un tutorial, tradúcela antes de pegarla.
cta: "Guárdalo para cuando recibas un archivo en inglés."
comentario_fijado: "Equivalencias del video: VLOOKUP = BUSCARV, COUNTIFS = CONTAR.SI.CONJUNTO, NETWORKDAYS = DIAS.LAB, FALSE = FALSO. Ejemplo en inglés: =VLOOKUP(A2,D:E,2,FALSE). En español: =BUSCARV(A2;D:E;2;FALSO). Según tu configuración regional (por ejemplo México y EE. UU.), el separador puede ser coma (,) en lugar de punto y coma (;)."
hashtags: ["#Excel", "#GoogleSheets", "#Fórmulas"]
palabras_clave: ["VLOOKUP en español", "BUSCARV en inglés", "nombres de funciones Excel inglés español"]
escenas:
  - narracion: "VLOOKUP y BUSCARV son la misma función. Cambia el idioma, no la lógica."
    visual:
      plantilla: hook
      datos: {kicker: "Excel bilingüe", titulo: "*VLOOKUP* es BUSCARV", sub: "Misma función, otro idioma"}
  - narracion: "En inglés escribes VLOOKUP, [[caunt ifs|COUNTIFS]] y [[net uerk deis|NETWORKDAYS]]. En español, BUSCARV, CONTAR.SI.CONJUNTO y DIAS.LAB. Misma lógica, otro nombre."
    visual:
      plantilla: versus
      datos:
        titulo: "Mismas funciones"
        izq: {etiqueta: "Inglés", titulo: "Excel en inglés", items: ["VLOOKUP", "COUNTIFS", "NETWORKDAYS"]}
        der: {etiqueta: "Español", titulo: "Excel en español", items: ["BUSCARV", "CONTAR.SI.CONJUNTO", "DIAS.LAB"]}
        veredicto: "Cambia el nombre, no la lógica"
  - narracion: "Y hay tres trampas al copiar una fórmula. FALSE se escribe FALSO. TRUE, VERDADERO. Y la coma entre argumentos puede ser punto y coma, según tu configuración regional."
    visual:
      plantilla: lista
      datos:
        titulo: "Tres trampas al traducir"
        estilo: x
        items:
          - {texto: "FALSE → FALSO", detalle: "el último argumento de BUSCARV"}
          - {texto: "TRUE → VERDADERO", detalle: "también cambia"}
          - {texto: "Coma ↔ punto y coma", detalle: "según la configuración regional"}
  - narracion: "Si abres un archivo de otra región, Excel suele mostrarte los nombres en tu idioma."
    visual:
      plantilla: cierre
      datos:
        titulo: "Traduce *antes* de pegar"
        puntos: ["Nombres de funciones", "FALSE / FALSO", "Separador de argumentos"]
        cta: "Guárdalo"
fuentes:
