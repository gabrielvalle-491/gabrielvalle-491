episodio: '#01'
pilar: trabajo
tipo_editorial: tutorial
idea: Inmovilizar la fila de encabezados para que siga visible al bajar en una tabla larga, en Excel y en Google Sheets.
objetivo: Tutorial rápido y buscable que resuelve una molestia diaria al trabajar con tablas largas.
publico: Personas que trabajan con listas largas en Excel o Google Sheets y pierden de vista los encabezados.
hipotesis: 'Formato ''tutorial'' en pilar ''trabajo'': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje).'
gancho: ¿Bajas en tu tabla y los encabezados desaparecen?
duracion_objetivo: 35-55 s (≈85-140 palabras)
titulo: 'Inmovilizar paneles: encabezados siempre visibles en Excel'
titulos_alternativos:
- Cómo fijar la primera fila en Excel y Google Sheets
- Tu tabla es larga y no ves los títulos? Haz esto
- Inmovilizar fila superior en 15 segundos
criterio_titulo: Usa el nombre exacto de la función en español ('Inmovilizar paneles') y promete el resultado.
descripcion: |-
  Cómo dejar fija la fila de encabezados al desplazarte por una tabla larga. En Excel: pestaña Vista, Inmovilizar paneles. En Google Sheets: menú Ver, Inmovilizar.
  Los nombres de menús pueden cambiar según la versión del programa y el idioma.
cta: Pruébalo en tu tabla más larga.
comentario_fijado: 'Excel: Vista > Inmovilizar paneles > Inmovilizar fila superior. Google Sheets: Ver > Inmovilizar > 1 fila. Para quitarlo: Movilizar paneles (Excel) o Ninguna fila (Sheets).'
hashtags:
- '#Excel'
- '#GoogleSheets'
- '#TrucosDeExcel'
palabras_clave:
- inmovilizar paneles Excel
- fijar fila encabezado
- congelar fila Google Sheets
escenas:
- narracion: ¿Bajas en tu tabla y los encabezados desaparecen? Déjalos fijos en pocos clics.
  visual:
    plantilla: hook
    datos:
      kicker: Truco de formato
      titulo: Encabezados que *no desaparecen*
      sub: Excel y Google Sheets
- narracion: En Excel, abre la pestaña Vista. Elige Inmovilizar paneles. Y pulsa Inmovilizar fila superior. Es lo más rápido cuando tus títulos están en la primera fila.
  visual:
    plantilla: pasos
    datos:
      titulo: En Excel
      pasos:
      - titulo: Pestaña Vista
        detalle: Arriba, en la cinta
      - titulo: Inmovilizar paneles
        detalle: Abre el menú
      - titulo: Inmovilizar fila superior
        detalle: Si tus títulos están en la fila 1
- narracion: Si tus títulos ocupan varias filas, en Excel selecciona la fila de abajo y elige Inmovilizar paneles. En Google Sheets, abre Ver, Inmovilizar y elige cuántas filas. En ambos, los títulos quedan fijos.
  visual:
    plantilla: versus
    datos:
      titulo: Varias filas de títulos
      izq:
        etiqueta: Excel
        titulo: Selecciona la fila de abajo
        items:
        - Vista → Inmovilizar paneles
        - Se fijan las filas de arriba
      der:
        etiqueta: Google Sheets
        titulo: Ver → Inmovilizar
        items:
        - Elige cuántas filas
        - 'Por ejemplo: 2 filas'
      veredicto: En ambos, los títulos quedan fijos al bajar
- narracion: Para quitarlos, usa Movilizar paneles en Excel, o Ninguna fila en Google Sheets. Así tus títulos te acompañan en listas largas.
  visual:
    plantilla: cierre
    datos:
      titulo: Títulos siempre *a la vista*
      puntos:
      - 'Excel: Movilizar paneles'
      - 'Sheets: Ninguna fila'
      cta: Guárdalo
