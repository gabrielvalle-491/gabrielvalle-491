id: B-085
canal: canal_b
fecha: 2027-01-11
formato: short
serie: Fórmula en 40 segundos
episodio: "#13"
pilar: formulas
tipo_editorial: tutorial
idea: "BUSCARX puede buscar con dos condiciones si unes los criterios con & tanto en el valor buscado como en el rango donde se busca."
objetivo: "Resolver una duda muy frecuente (buscar por producto y talla, por ejemplo) con una fórmula corta."
publico: "Personas que usan BUSCARX o BUSCARV y necesitan encontrar un dato que depende de dos columnas."
hipotesis: "Formato 'tutorial' en pilar 'formulas': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje)."
gancho: "BUSCARX busca un solo valor. Pero puedes pasarle dos."
duracion_objetivo: "35-55 s (≈85-140 palabras)"
titulo: "BUSCARX con dos condiciones: la fórmula que lo resuelve"
titulos_alternativos:
  - "Buscar por producto y talla en Excel con una sola fórmula"
  - "BUSCARX con varios criterios (concatenando con &)"
  - "Cómo buscar con dos columnas a la vez en Excel"
criterio_titulo: "Nombra la función y el problema exacto (dos condiciones), tal como se busca."
descripcion: |
  Para buscar con dos condiciones en BUSCARX, une los dos criterios con & y haz lo mismo con las dos columnas donde buscas. En el ejemplo ilustrativo buscamos el precio de un pantalón talla M.
  Si la combinación aparece repetida, BUSCARX devuelve la primera coincidencia. BUSCARX requiere Excel 2021 o Microsoft 365.
cta: "Guárdalo para tu próxima búsqueda con dos criterios."
comentario_fijado: "Fórmula: =BUSCARX(\"Pantalón\"&\"M\";A2:A5&B2:B5;C2:C5). Con los criterios en celdas, por ejemplo F2 y G2: =BUSCARX(F2&G2;A2:A5&B2:B5;C2:C5). En México y EE. UU. Excel suele usar coma (,) en lugar de punto y coma (;)."
hashtags: ["#Excel", "#BUSCARX", "#Fórmulas"]
palabras_clave: ["BUSCARX varios criterios", "buscar con dos condiciones excel", "BUSCARX concatenar"]
escenas:
  - narracion: "BUSCARX busca un solo valor. Pero puedes pasarle dos."
    visual:
      plantilla: hook
      datos: {kicker: "Fórmula en 40 segundos", titulo: "BUSCARX con *dos condiciones*"}
  - narracion: "Une los dos criterios con el símbolo &. Haz lo mismo con las dos columnas. Y al final, la columna con el precio."
    visual:
      plantilla: formula
      datos:
        formula: "=BUSCARX(\"Pantalón\"&\"M\";A2:A5&B2:B5;C2:C5)"
        partes:
          - {token: "\"Pantalón\"&\"M\"", explica: "los dos criterios unidos"}
          - {token: "A2:A5&B2:B5", explica: "las dos columnas unidas"}
          - {token: "C2:C5", explica: "el precio que se devuelve"}
  - narracion: "En esta tabla, el pantalón talla M cuesta 38. La fórmula lo encuentra aunque haya otro pantalón en otra talla."
    visual:
      plantilla: planilla
      datos:
        titulo: "Precios (ilustrativos)"
        formula: "=BUSCARX(\"Pantalón\"&\"M\";A2:A5&B2:B5;C2:C5)"
        celda_formula: "D2"
        filas:
          - ["Producto", "Talla", "Precio", "Resultado"]
          - ["Camisa", "S", 20, ""]
          - ["Camisa", "M", 22, ""]
          - ["Pantalón", "S", 35, ""]
          - ["Pantalón", "M", 38, ""]
        resaltar:
          - {rango: "A5:B5", beat: 1}
        resultado: {celda: "D2", valor: "38", beat: 2}
  - narracion: "Si la combinación se repite, devuelve la primera. Y requiere Excel 2021 o Microsoft 365."
    visual:
      plantilla: dato
      datos: {kicker: "Ten en cuenta", dato: "Si hay combinaciones repetidas, devuelve la *primera*", contexto: "BUSCARX: Excel 2021 o Microsoft 365"}
  - narracion: "Dos columnas unidas con ampersand, un solo resultado. Cambia el producto y la talla, y la fórmula encuentra el precio."
    visual:
      plantilla: cierre
      datos:
        titulo: "Dos condiciones, *una fórmula*"
        puntos: ["Criterios unidos con &", "Columnas unidas con &", "Devuelve la primera coincidencia"]
        cta: "Guárdalo"
