  titulo: Revisar las instrucciones para personalizar un formato de número (Microsoft Support)
  fecha_consulta: '2026-10-11'
  respalda: Un separador después de un marcador de dígito escala el número por 1 000; el símbolo depende de la configuración regional; el formato no cambia el valor real de la celda.
- calculo: '[1500]'
  respalda: Valor ilustrativo de la celda.
- calculo: 1500 / 1000
  resultado: 1.5
  respalda: 'Lo que se ve tras dividir entre mil: 1,5 k.'
riesgos:
  derechos: bajo — material propio
  exactitud: medio — el código exacto depende de la configuración regional de Excel (Windows/Mac) y no se pudo probar en cada país; revisar en un Excel con coma decimal y en otro con punto decimal antes de publicar.
  monetizacion: bajo — educación general, sin recomendar productos
