id: B-006
canal: canal_b
fecha: 2026-10-24
formato: short
serie: Tu dinero en una planilla
episodio: "#03"
pilar: dinero
tipo_editorial: contraintuitivo
idea: "La regla del 72 (72 ÷ tasa) estima en cuántos periodos se duplica una cantidad que crece con interés compuesto; se compara con el cálculo exacto con logaritmos."
objetivo: "Dar un atajo mental útil y mostrar su límite: es una estimación, buena con tasas moderadas, que se aleja con tasas muy altas."
publico: "Personas que empiezan a entender el interés compuesto y quieren una forma rápida de estimar plazos."
hipotesis: "Gancho 'pregunta' + duración corta + visual 'demo': comparar % visto y vistas a 7 días contra la media de la fase de aprendizaje."
gancho: "¿En cuántos años se duplica algo que crece 8 % al año?"
duracion_objetivo: "20-32 s (≈55-80 palabras)"
titulo: "Regla del 72: cuándo se duplica tu dinero (y su límite)"
titulos_alternativos:
  - "Regla del 72 vs cálculo exacto: ¿qué tan cerca está?"
  - "El atajo mental para estimar el interés compuesto"
  - "72 dividido entre la tasa: ¿funciona siempre?"
criterio_titulo: "Usa el nombre buscable (regla del 72) y anticipa honestamente que tiene un límite."
descripcion: |
  La regla del 72 estima el tiempo de duplicación dividiendo 72 entre la tasa por periodo. Con 8 % da 9 años; el cálculo exacto con logaritmos da unos 9,01.
  Es una aproximación: funciona mejor con tasas moderadas. Las tasas del ejemplo son ilustrativas y no son una promesa de rendimiento ni una recomendación.
cta: "Pruébala con otra tasa y compara con el cálculo exacto."
comentario_fijado: "Cálculo exacto en la planilla: =LN(2)/LN(1+8%). Atajo: =72/8. En México y EE. UU. Excel suele usar coma (,) en lugar de punto y coma (;) entre argumentos."
hashtags: ["#Excel", "#InteresCompuesto", "#FinanzasPersonales"]
palabras_clave: ["regla del 72", "interés compuesto", "cuánto tarda en duplicarse"]
escenas:
  - narracion: "¿En cuántos años se duplica algo que crece 8 % al año? ¿Seis, nueve o doce? Nueve: 72 dividido entre 8."
    visual:
      plantilla: pregunta
      datos:
        pregunta: "¿Cuándo se duplica con 8 % anual?"
        opciones: ["6 años", "9 años", "12 años"]
        correcta: 1
        explicacion: "72 ÷ 8 = 9 años"
  - narracion: "Atajo: 72 entre 8, da 9. Exacto, con logaritmos: da 9,01. Casi igual."
    visual:
      plantilla: calculo
      datos:
        titulo: "Atajo vs exacto"
        lineas:
          - {izq: "Atajo: 72 ÷ 8", der: "9 años"}
          - {izq: "Exacto: LN(2) ÷ LN(1,08)", der: "9,01 años"}
        resultado: {izq: "Diferencia", der: "mínima"}
  - narracion: "Con 6 %, 12 años. Con 8 %, 9. Con 12 %, 6. Con tasas muy altas, el atajo se aleja del valor exacto."
    visual:
      plantilla: barras
      datos:
        titulo: "Años para duplicar (72 ÷ tasa)"
        sufijo: " años"
        items:
          - {etiqueta: "Tasa 6 %", valor: 12}
          - {etiqueta: "Tasa 8 %", valor: 9, destacado: true}
          - {etiqueta: "Tasa 12 %", valor: 6}
  - narracion: "Tasas ilustrativas: es una estimación, no una predicción."
    visual:
      plantilla: cierre
      datos:
        titulo: "Un *atajo*, no una promesa"
        puntos: ["Atajo: 72 ÷ tasa", "Exacto: =LN(2)/LN(1+8%)"]
        cta: "Pruébalo"
fuentes:
  - url: "https://en.wikipedia.org/wiki/Rule_of_72"
    titulo: "Rule of 72 (Wikipedia)"
    fecha_consulta: 2026-10-11
    respalda: "La regla estima el tiempo de duplicación como 72 dividido entre la tasa porcentual por periodo; es una aproximación del valor exacto y el error crece con tasas altas."
    cifras: [72]
  - calculo: "72 / 8"
    resultado: 9
    respalda: "Estimación con la regla del 72 para una tasa ilustrativa de 8 %."
  - calculo: "round(log(2) / log(1.08), 2)"
    resultado: 9.01
    respalda: "Cálculo exacto del tiempo de duplicación con 8 % anual (logaritmos)."
  - calculo: "72 / 6"
    resultado: 12
    respalda: "Años para duplicar con 6 % según la regla."
  - calculo: "72 / 12"
    resultado: 6
    respalda: "Años para duplicar con 12 % según la regla."
riesgos:
