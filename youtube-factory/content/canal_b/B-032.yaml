        veredicto: "Ejemplo: del *producto* al código"
  - narracion: "Para sacar el código a partir del producto, la fórmula es esta. INDICE devuelve de la columna de códigos. COINCIDIR halla la posición del producto; el cero pide coincidencia exacta."
    visual:
      plantilla: formula
