  - narracion: "BUSCARV necesita el dato buscado en la primera columna y usa un número de columna. INDICE y COINCIDIR trabajan con rangos, así que devuelven de cualquier columna. Si insertas una columna, los rangos se ajustan; un número fijo, no."
    visual:
      plantilla: versus
      datos:
        izq: {etiqueta: "Límite", titulo: "BUSCARV", items: ["Busca solo en la primera columna", "Usa un número de columna"]}
