idea: "INDICE + COINCIDIR busca en cualquier columna, incluso hacia la izquierda, y no depende de un número de columna como BUSCARV."
objetivo: "Comparación de alto valor para quien usa BUSCARV y se topa con sus límites; menciona BUSCARX como alternativa moderna."
publico: "Usuarios de BUSCARV que necesitan devolver una columna a la izquierda de la búsqueda o que insertan columnas con frecuencia."
hipotesis: "Formato 'comparacion' en pilar 'formulas': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje)."
gancho: "BUSCARV no puede mirar a la izquierda. Esta pareja de funciones sí."
duracion_objetivo: "35-55 s (≈85-140 palabras)"
titulo: "INDICE + COINCIDIR vs BUSCARV: buscar a la izquierda en Excel"
titulos_alternativos:
  - "BUSCARV no mira a la izquierda: la solución con INDICE y COINCIDIR"
  - "Por qué INDICE + COINCIDIR no se rompe al insertar columnas"
  - "Alternativa a BUSCARV que funciona en cualquier columna"
criterio_titulo: "Nombra las funciones comparadas y el caso concreto (buscar a la izquierda)."
descripcion: |
  BUSCARV exige que el valor buscado esté en la primera columna del rango y usa un número de columna. INDICE y COINCIDIR trabajan con rangos, así que pueden devolver una columna a la izquierda del dato buscado.
  En Excel 365 y 2021, BUSCARX resuelve lo mismo de forma más corta; no está disponible en Excel 2016 ni 2019, según la documentación de Microsoft.
cta: "Reemplaza un BUSCARV tuyo y compara."
comentario_fijado: "Fórmula: =INDICE(A2:A5;COINCIDIR(E2;B2:B5;0)) devuelve el código (columna A) del producto escrito en E2 (columna B). En México y EE. UU. Excel suele usar coma (,) en lugar de punto y coma (;)."
hashtags: ["#Excel", "#Fórmulas", "#BUSCARV"]
palabras_clave: ["INDICE COINCIDIR", "buscar a la izquierda Excel", "alternativa a BUSCARV"]
