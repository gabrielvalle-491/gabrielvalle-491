idea: 'Un control de stock sencillo: saldo = inicial + entradas − salidas por producto, y SUMAR.SI para traer los totales desde listas de movimientos.'
objetivo: Mini sistema práctico para pequeños negocios que llevan inventario en una planilla.
publico: Emprendedores y encargados de tienda que quieren saber cuánto stock queda de cada producto.
hipotesis: 'Formato ''tutorial'' en pilar ''trabajo'': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje).'
gancho: Calcula el saldo de cada producto con una sola fórmula.
duracion_objetivo: 35-55 s (≈85-140 palabras)
titulo: 'Control de stock en Excel: entradas, salidas y saldo (fórmula)'
titulos_alternativos:
- 'Inventario en Excel: saldo = inicial + entradas − salidas'
- Cómo llevar el stock de tu negocio en una planilla
- Entradas y salidas de inventario con SUMAR.SI
criterio_titulo: Describe el sistema (stock con entradas y salidas) y la herramienta (Excel), con la fórmula del saldo.
descripcion: |-
  Control de stock básico: stock inicial más entradas menos salidas da el saldo de cada producto. Si registras cada movimiento en otra hoja, la función SUMAR.SI trae el total por producto.
  Cantidades ilustrativas.
cta: Arma tu hoja de stock con tus productos.
comentario_fijado: 'Saldo en E2: =B2+C2-D2 (inicial, entradas y salidas). Entradas desde otra hoja: =SUMAR.SI(Entradas!A:A;A2;Entradas!B:B). En México y EE. UU. Excel suele usar coma (,) en lugar de punto y coma (;).'
hashtags:
