descripcion: |
  BUSCARX busca un valor en una columna y devuelve el dato de la misma fila en otra columna, sin tener que contar columnas. Por defecto hace coincidencia exacta y tiene un argumento para mostrar un texto si no encuentra el valor.
  Disponible en Excel 2021, Excel 2024 y Excel para Microsoft 365, según la ayuda de Microsoft.
cta: "Pruébalo con tu lista de precios."
comentario_fijado: "Fórmula: =BUSCARX(A5;A2:A4;C2:C4). Con texto si no lo encuentra: =BUSCARX(A5;A2:A4;C2:C4;\"No existe\"). En México y EE. UU. Excel suele usar coma (,) en lugar de punto y coma (;)."
hashtags: ["#Excel", "#Fórmulas", "#BUSCARX"]
