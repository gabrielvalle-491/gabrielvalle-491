    fecha_consulta: 2026-10-11
    respalda: "Al ordenar un rango con celdas combinadas (no todas, o de distinto tamaño) puede aparecer un error; la solución es separarlas o que tengan el mismo tamaño."
  - url: "https://support.microsoft.com/es-es/Excel/get-started/merge-and-unmerge-cells-in-excel"
    titulo: "Combinar y separar celdas (Microsoft Support)"
    fecha_consulta: 2026-10-11
    respalda: "Al combinar celdas solo se conserva el contenido de la celda superior izquierda; las demás se eliminan."
  - url: "https://support.microsoft.com/kb/212022/pt-br"
    titulo: "Center Across Columns (artículo de Microsoft Support)"
    fecha_consulta: 2026-10-11
    respalda: "Se puede centrar texto entre columnas sin combinar celdas con la opción Centrar en la selección (Formato de celdas, pestaña Alineación, lista Horizontal)."
