formato: short
serie: Tu dinero en una planilla
episodio: '#13'
pilar: dinero
tipo_editorial: comparacion
idea: Con el mismo dinero mensual, pagar primero la deuda de mayor tasa (avalancha) genera menos intereses que pagar primero la de menor saldo (bola de nieve); ejemplo ilustrativo calculado mes a mes.
objetivo: 'Educación financiera general: entender la diferencia entre ambos órdenes de pago y cómo comprobarla en una planilla.'
publico: Personas con varias deudas que quieren decidir en qué orden pagarlas.
hipotesis: 'Formato ''comparacion'' en pilar ''dinero'': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje).'
gancho: 'Mismas deudas, mismo dinero: el orden de pago cambia US$ 263 de intereses.'
duracion_objetivo: 35-55 s (≈85-140 palabras)
titulo: 'Bola de nieve vs avalancha: cuánto interés cambia (con números)'
titulos_alternativos:
- 'Deudas: pagar la más chica o la más cara primero'
- Método avalancha vs bola de nieve, calculado mes a mes
- 'Mismo dinero, menos intereses: el orden de pago importa'
criterio_titulo: Nombra los dos métodos y promete una comparación numérica concreta.
descripcion: |-
  Ejemplo ilustrativo: dos deudas, de US$ 800 al 1 % mensual (mínimo US$ 25) y de US$ 2 400 al 4 % mensual (mínimo US$ 80), con US$ 300 al mes en total. Con bola de nieve (primero la más pequeña) los intereses suman unos US$ 961; con avalancha (primero la de mayor tasa) unos US$ 698.
  Las tasas y montos son inventados para el ejemplo y no representan ningún producto. Contenido educativo general, no es asesoramiento financiero.
cta: Haz la cuenta con tus propios saldos y tasas.
comentario_fijado: 'Plan: pagar el mínimo de todas las deudas y mandar el resto al objetivo; al liquidar una deuda, su pago pasa a la siguiente. Puedes simularlo mes a mes con =SALDO*(1+TASA)-PAGO en cada columna. En México y EE. UU. Excel suele usar coma (,) en lugar de punto y coma (;).'
hashtags:
