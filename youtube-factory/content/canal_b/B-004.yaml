pilar: errores
tipo_editorial: error_comun
idea: "Al copiar una fórmula hacia abajo, las referencias relativas se desplazan; el signo $ (referencia absoluta) fija la celda de la tasa para que no se mueva."
objetivo: "Evitar uno de los errores más frecuentes al copiar fórmulas y dar una regla simple (relativa se mueve, absoluta se queda) con el atajo F4."
publico: "Personas que usan Excel en el trabajo o en sus finanzas y ven ceros o resultados raros al copiar una fórmula."
hipotesis: "Gancho 'contraste' + duración corta + visual 'comparación': comparar % visto y vistas a 7 días contra la media de la fase de aprendizaje."
gancho: "Misma fórmula, copiada hacia abajo: la primera fila sale bien y la segunda da cero."
duracion_objetivo: "20-32 s (≈55-80 palabras)"
titulo: "Por qué tu fórmula da cero al copiarla (el signo $)"
titulos_alternativos:
  - "Referencia absoluta en Excel: cuándo usar el signo $"
  - "F4 en Excel: fija una celda al copiar fórmulas"
  - "El error de copiar fórmulas que todos cometen"
criterio_titulo: "Describe el síntoma que la persona busca (la fórmula da cero al copiar) y nombra la solución (signo $)."
descripcion: |
  Al copiar una fórmula, las referencias relativas se mueven con ella. Si una celda debe quedarse quieta, como una tasa, se vuelve absoluta con el signo $ (por ejemplo $D$2).
  En Excel para Windows, F4 agrega o cambia los signos $ de la referencia. Los datos del ejemplo son ilustrativos.
cta: "Guárdalo para tu próxima planilla."
comentario_fijado: "Fórmula del ejemplo: =A2*$D$2 (precio por la tasa fija en D2). En México y EE. UU. Excel suele usar coma (,) en lugar de punto y coma (;) entre argumentos."
hashtags: ["#Excel", "#Fórmulas", "#GoogleSheets"]
palabras_clave: ["referencia absoluta excel", "signo $ excel", "F4 excel", "fórmula da cero al copiar"]
escenas:
