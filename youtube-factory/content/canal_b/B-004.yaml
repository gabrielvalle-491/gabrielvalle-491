          - {rango: "D3", beat: 1}
        resultado: {celda: "B3", valor: "0", beat: 1}
        nota: "La tasa quedó una fila más arriba"
  - narracion: "Sin signo de dólar, la referencia es relativa y se mueve. Con el signo de dólar, es absoluta y se queda. Para ponerlo, usa [[efe cuatro|F4]]."
    visual:
      plantilla: versus
      datos:
        izq: {etiqueta: "Relativa", titulo: "Se mueve", items: ["=A2*D2", "D2 pasa a D3"]}
        der: {etiqueta: "Absoluta", titulo: "Se queda", items: ["=A2*$D$2", "Siempre apunta a D2"]}
        veredicto: "F4 pone los signos $"
  - narracion: "Antes de copiar, pregúntate: ¿esta celda debe moverse o quedarse?"
    visual:
      plantilla: cierre
      datos:
        titulo: "¿Se *mueve* o se *queda*?"
        puntos: ["Relativa: A2", "Absoluta: $A$2"]
        cta: "Guárdalo"
