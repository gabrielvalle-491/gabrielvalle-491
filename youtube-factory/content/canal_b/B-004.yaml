    visual:
      plantilla: hook
      datos: {kicker: "Error que todos cometen", titulo: "Copias la fórmula y da *cero*"}
  - narracion: "El impuesto usa la tasa de la celda [[de dos|D2]]. Al copiar, la fórmula se mueve a [[de tres|D3]], que está vacía."
    visual:
      plantilla: planilla
      datos:
        formula: "=A3*D3"
        celda_formula: "B3"
        filas:
          - ["Precio", "Impuesto", "", "Tasa"]
