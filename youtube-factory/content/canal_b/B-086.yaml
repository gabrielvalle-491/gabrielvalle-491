    visual:
      plantilla: hook
      datos: {kicker: "Mini sistema", titulo: "Que nadie borre tus *fórmulas*"}
  - narracion: "Dato clave: en Excel todas las celdas ya están bloqueadas. Pero ese bloqueo solo funciona cuando proteges la hoja."
    visual:
      plantilla: mito
      datos:
        mito: "Si bloqueas una celda, ya está protegida"
        realidad: "El bloqueo *solo* funciona al proteger la hoja"
  - narracion: "Primero, selecciona las celdas donde sí se puede escribir. Segundo, en Formato de celdas, pestaña Proteger, desmarca Bloqueada. Tercero, en Revisar, elige Proteger hoja."
    visual:
      plantilla: pasos
      datos:
        titulo: "Tres pasos"
        pasos:
          - {titulo: "Selecciona las celdas editables", detalle: "donde otros pueden escribir"}
          - {titulo: "Formato de celdas → Proteger", detalle: "desmarca Bloqueada"}
          - {titulo: "Revisar → Proteger hoja", detalle: "las fórmulas quedan bloqueadas"}
  - narracion: "Ojo: según Microsoft, proteger una hoja no es una medida de seguridad. Solo evita cambios accidentales."
    visual:
      plantilla: dato
      datos: {kicker: "Ojo", dato: "Evita cambios *accidentales*, no protege datos sensibles", contexto: "Según la ayuda de Microsoft"}
  - narracion: "Protege tus fórmulas antes de compartir la planilla. Así nadie las borra por accidente mientras trabaja en ella."
    visual:
      plantilla: cierre
      datos:
