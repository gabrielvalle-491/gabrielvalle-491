tipo_editorial: tutorial
idea: "En Excel todas las celdas están bloqueadas por defecto, pero el bloqueo solo funciona al proteger la hoja: desbloquea las celdas de datos y protege la hoja para resguardar las fórmulas."
objetivo: "Evitar que se borren fórmulas por accidente en planillas compartidas, aclarando que no es una medida de seguridad fuerte."
publico: "Personas que comparten planillas con fórmulas y temen que alguien las borre o las sobrescriba sin querer."
hipotesis: "Formato 'tutorial' en pilar 'trabajo': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje)."
gancho: "Alguien borró tu fórmula y nadie sabe cuándo. Evítalo en tres pasos."
duracion_objetivo: "35-55 s (≈85-140 palabras)"
titulo: "Proteger celdas con fórmulas en Excel (en 3 pasos)"
titulos_alternativos:
  - "Cómo evitar que borren tus fórmulas por accidente"
  - "Bloquear solo las fórmulas y dejar el resto editable"
  - "Proteger hoja en Excel: lo que casi nadie explica"
criterio_titulo: "Nombra el problema real (fórmulas borradas) y el método concreto, con términos de búsqueda."
descripcion: |
  Por defecto, todas las celdas de Excel están bloqueadas, pero ese bloqueo solo se aplica cuando proteges la hoja. Por eso el truco es desbloquear primero las celdas donde otras personas pueden escribir, y luego proteger la hoja.
  Importante: según Microsoft, la protección de una hoja no es una característica de seguridad; solo evita cambios accidentales. Los nombres de menú pueden variar según tu versión de Excel.
cta: "Protege tus fórmulas antes de compartir la planilla."
comentario_fijado: "Ruta: selecciona las celdas editables > clic derecho > Formato de celdas > pestaña Proteger > desmarca Bloqueada. Luego: Revisar > Proteger hoja. Si pones contraseña y la pierdes, no hay forma de desproteger la hoja."
hashtags: ["#Excel", "#Productividad", "#Fórmulas"]
palabras_clave: ["proteger celdas con fórmulas", "bloquear celdas excel", "proteger hoja excel"]
escenas:
