  - calculo: "[42000, 6100, 11800, 12900, 4500, 7800, 3200]"
    respalda: "Importes de los siete gastos de ejemplo (ficticios)."
  - calculo: "[45000, 30000, 12000, 5000]"
    respalda: "Plan por categoría del ejemplo (ficticio): Vivienda, Alimentación, Transporte y Ocio."
  - calculo: "42000 + 6100"
    resultado: 48100
    respalda: "Real de Vivienda (filas 2 y 6)."
  - calculo: "11800 + 12900"
    resultado: 24700
    respalda: "Real de Alimentación (filas 3 y 7)."
  - calculo: "4500 + 7800"
    resultado: 12300
    respalda: "Real de Transporte (filas 4 y 8)."
  - calculo: "48100 + 24700 + 12300 + 3200"
    resultado: 88300
    respalda: "Suma de las cuatro categorías = total de la lista (D9)."
  - calculo: "42000 + 11800 + 4500 + 3200 + 6100 + 12900 + 7800"
    resultado: 88300
    respalda: "Total de la lista de gastos (D2:D8); coincide con la suma de las categorías."
