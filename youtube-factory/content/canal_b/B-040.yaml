        - Última edición
        - Historial de versiones
      veredicto: En Excel, guarda primero en la nube
- narracion: En Excel, haz clic en el título del archivo. Elige Historial de versiones. Selecciona una versión y pulsa Restaurar.
  visual:
    plantilla: pasos
    datos:
      titulo: En Excel
      pasos:
      - titulo: Clic en el título del archivo
      - titulo: Historial de versiones
