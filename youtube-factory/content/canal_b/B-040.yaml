id: B-040
canal: canal_b
fecha: '2026-11-27'
formato: short
serie: Excel vs Sheets
episodio: '#01'
pilar: excel_vs_sheets
tipo_editorial: comparacion
idea: 'Recuperar una versión anterior de un archivo: en Excel requiere archivo en OneDrive o SharePoint; en Google Sheets se abre desde Última edición > Historial de versiones.'
objetivo: Comparación práctica que evita perder trabajo y aclara una condición que mucha gente desconoce.
publico: Personas que trabajan en equipo o editan por error y necesitan volver atrás.
hipotesis: 'Formato ''comparacion'' en pilar ''excel_vs_sheets'': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje).'
gancho: ¿Borraste algo por error y ya guardaste? Vuelve a una versión anterior.
duracion_objetivo: 35-55 s (≈85-140 palabras)
titulo: 'Historial de versiones: recuperar un archivo en Excel y Sheets'
titulos_alternativos:
- Recupera una versión anterior en Excel y Google Sheets
- 'Borré datos por error: cómo volver atrás en Excel y Sheets'
- 'Excel vs Google Sheets: historial de versiones'
criterio_titulo: Plantea el problema real (borrar por error) y nombra ambos programas.
descripcion: |-
  Cómo volver a una versión anterior. En Excel, según la ayuda de Microsoft, el historial de versiones funciona con archivos guardados en OneDrive o SharePoint. En Google Sheets, abre Última edición y luego Historial de versiones.
  Los nombres de los menús pueden variar según la versión y el idioma.
cta: Revisa dónde guardas tus archivos importantes.
comentario_fijado: 'Excel: clic en el título del archivo > Historial de versiones > elige versión > Restaurar. Sheets: Última edición > Historial de versiones > Restablecer esta versión.'
hashtags:
- '#Excel'
- '#GoogleSheets'
- '#ExcelVsSheets'
palabras_clave:
- historial de versiones Excel
- recuperar versión anterior Google Sheets
- restaurar archivo Excel
escenas:
- narracion: ¿Borraste algo por error y ya guardaste? Vuelve a una versión anterior.
  visual:
    plantilla: hook
    datos:
      kicker: Excel vs Sheets
      titulo: Vuelve a una *versión anterior*
      sub: Historial de versiones
- narracion: En Excel, el historial funciona con archivos guardados en OneDrive o SharePoint. En Google Sheets, necesitas permiso para editar el archivo. En Excel, primero guarda en la nube.
  visual:
    plantilla: versus
    datos:
      titulo: Lo que necesitas
      izq:
        etiqueta: Excel
        titulo: Archivo en la nube
        items:
        - OneDrive o SharePoint
        - 'Cuenta personal: últimas 25'
      der:
