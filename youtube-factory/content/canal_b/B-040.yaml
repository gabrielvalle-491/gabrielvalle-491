      - Abre Última edición
      - Elige Historial de versiones
      - Pulsa Restablecer esta versión
- narracion: 'Revisa la versión antes de restaurar: así no pisas cambios buenos.'
  visual:
    plantilla: cierre
    datos:
      titulo: Antes de perder trabajo, *guarda en la nube*
      puntos:
