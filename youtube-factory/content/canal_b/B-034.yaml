- calculo: '[1000, 1.19]'
  respalda: Datos ilustrativos del ejemplo (precio y factor 1 + 19 %).
- calculo: 1000 * 1.19
  resultado: 1190
  respalda: Precio con IVA al 19 %.
- calculo: 1190 / 1.19
  resultado: 1000
  respalda: Precio sin IVA a partir del precio con IVA.
riesgos:
  derechos: bajo — material propio
  exactitud: medio — las tasas generales pueden cambiar por reformas; verificar en SAT, DIAN, SII y ARCA el día de publicar. Las fuentes de Argentina y México son textos de ley que pueden no estar actualizados.
  monetizacion: bajo — educación general, sin recomendar productos
