  titulo: Insertar una tabla (Microsoft Support)
  fecha_consulta: '2026-10-11'
  respalda: Seleccionar una celda de los datos y pulsar Ctrl+T crea la tabla; Excel detecta las filas y columnas; Ctrl+L es equivalente.
- url: https://support.microsoft.com/es-ES/Excel/use-calculated-columns-in-an-excel-table
  titulo: Usar columnas calculadas en una tabla de Excel (Microsoft Support)
  fecha_consulta: '2026-10-11'
  respalda: Al escribir una fórmula en una celda de la tabla y pulsar Entrar, se rellena en toda la columna.
- url: https://support.microsoft.com/es-ES/Excel/overview-of-excel-tables
  titulo: Descripción general de las tablas de Excel (Microsoft Support)
  fecha_consulta: '2026-10-11'
  respalda: Las tablas se amplían al agregar datos y los encabezados incluyen filtros.
- calculo: 12 * 3
  resultado: 36
  respalda: Total del cable en el ejemplo (precio por cantidad).
