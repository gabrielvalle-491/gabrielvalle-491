id: B-047
canal: canal_b
fecha: '2026-12-04'
formato: short
serie: Tu dinero en una planilla
episodio: '#16'
pilar: dinero
tipo_editorial: tutorial
idea: La guía 50/30/20 reparte el ingreso en necesidades, deseos y ahorro o deudas; una sola fórmula con la referencia del ingreso fija calcula los tres montos.
objetivo: Tutorial financiero básico y reutilizable con una fórmula de referencia absoluta.
publico: Personas que quieren armar un presupuesto sencillo en una planilla.
hipotesis: 'Formato ''tutorial'' en pilar ''dinero'': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje).'
gancho: Un ingreso, tres montos y una sola fórmula.
duracion_objetivo: 35-55 s (≈85-140 palabras)
titulo: Presupuesto 50/30/20 en Excel con una sola fórmula
titulos_alternativos:
- Cómo hacer un presupuesto 50/30/20 en una planilla
- 'Regla 50/30/20: calcula tus tres montos automáticamente'
- Presupuesto en Excel con referencia absoluta ($)
criterio_titulo: Nombra el método (muy buscado) y promete la planilla.
descripcion: |-
  La guía 50/30/20 reparte el ingreso en 50 % necesidades, 30 % deseos y 20 % ahorro y pago de deudas. Es un punto de partida flexible, no una norma: ajusta los porcentajes a tu situación.
  Ejemplo ilustrativo con un ingreso de 1 200. Contenido educativo general, no es asesoramiento financiero.
cta: Ajusta los porcentajes a tu realidad.
comentario_fijado: 'Fórmula en C3, copiada hacia abajo: =$C$2*B3 con el ingreso en C2 y los porcentajes en B3:B5. En México y EE. UU. Excel suele usar coma (,) en lugar de punto y coma (;).'
hashtags:
- '#FinanzasPersonales'
- '#Presupuesto'
- '#Excel'
palabras_clave:
- presupuesto 50/30/20
- planilla de presupuesto
- referencia absoluta Excel
