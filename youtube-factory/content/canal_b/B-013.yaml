          - ["Ana Ruiz", "Ana"]
          - ["Luis Mora", "Luis"]
          - ["Eva Soto", "Eva"]
        resaltar:
          - {rango: "B2", beat: 1}
          - {rango: "B3:B4", beat: 2, alterno: true}
  - narracion: "Relleno rápido copia un patrón, no entiende reglas. Con nombres compuestos, revisa fila por fila."
    visual:
      plantilla: cierre
      datos:
        titulo: "Un ejemplo, *Ctrl + E*, y revisa"
        puntos: ["Escribe un ejemplo", "Ctrl + E", "Revisa el resultado"]
        cta: "Pruébalo"
