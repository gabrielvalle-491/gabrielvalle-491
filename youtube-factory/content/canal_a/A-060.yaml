  exactitud: "medio — la página oficial consultada está redactada para versiones previas y no menciona explícitamente 'Windows 11' en los resultados; la combinación Windows + H es la documentada. Probar en un equipo con Windows 11 (10 segundos) antes de publicar."
  monetizacion: "bajo"
