descripcion: |
  La palabra «robot» se popularizó con la obra R.U.R., del escritor checo Karel Čapek, publicada en 1920 y estrenada en 1921. Viene de «robota», que en checo se asocia con trabajo forzado.
  Según el propio Karel, la palabra fue idea de su hermano Josef. En la obra, los robots son trabajadores artificiales.
