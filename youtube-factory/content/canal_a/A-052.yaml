idea: "Un bucle de pocas líneas con pathlib numera archivos en orden; primero se prueba en una carpeta copia y solo muestra los nombres nuevos antes de renombrar."
objetivo: "Primer script de automatización de archivos, seguro por diseño (copia y simulación), para no programadores."
publico: "Administrativos y emprendedores con carpetas de fotos o documentos con nombres desordenados."
hipotesis: "Formato 'tutorial' en pilar 'automatizacion': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje)."
gancho: "¿Renombrar 100 archivos a mano? Un bucle de Python lo hace por ti."
duracion_objetivo: "35-55 s (≈85-140 palabras)"
titulo: "Renombrar 100 archivos con Python en pocas líneas"
titulos_alternativos:
  - "Cambia el nombre de cientos de archivos sin hacerlo a mano"
  - "Python para no programadores: numerar archivos con seguridad"
  - "Renombrar archivos en lote: primero prueba en una copia"
criterio_titulo: "Describe el resultado concreto y la herramienta; 'renombrar archivos con Python' es una búsqueda frecuente."
descripcion: |
  Script con pathlib que ordena los archivos .jpg de una carpeta y les asigna nombres como foto_001.jpg. Primero solo muestra en pantalla los cambios; cuando estén bien, quitas el comentario de la línea que renombra.
  Haz siempre una copia de la carpeta: según la documentación de Python, si el nombre nuevo ya existe, rename reemplaza el archivo en Unix y da error en Windows. Requiere tener Python instalado.
cta: "Guárdalo para tu próxima carpeta desordenada."
comentario_fijado: |
  Código:
  from pathlib import Path
  d = Path("copia")
  fotos = sorted(d.glob("*.jpg"))
  for n, f in enumerate(fotos, 1):
      nuevo = f"foto_{n:03d}.jpg"
      print(f.name, "->", nuevo)
      # f.rename(d / nuevo)
  Prueba primero en una copia de la carpeta.
hashtags: ["#Python", "#Automatización", "#Productividad"]
palabras_clave: ["renombrar archivos con Python", "pathlib rename", "automatizar archivos", "Python para principiantes"]
