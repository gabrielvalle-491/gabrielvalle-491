    titulo: "What are tokens and how to count them? (OpenAI Help Center)"
    fecha_consulta: 2026-10-11
    respalda: "Un token puede ser desde un carácter hasta una palabra según idioma y contexto; en inglés, aproximadamente 4 caracteres, 3/4 de palabra y 75 palabras por cada 100 tokens; la tokenización varía por modelo."
    cifras: [100, 75]
