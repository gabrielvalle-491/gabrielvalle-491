fecha: 2026-11-28
formato: short
serie: Glosario rápido
episodio: "#01"
pilar: conceptos
tipo_editorial: contraintuitivo
idea: "Los modelos de lenguaje procesan tokens (trozos de texto), no palabras ni letras; esto es una de las explicaciones de por qué pueden fallar al contar letras."
objetivo: "Explicar qué es un token con una equivalencia verificada y una consecuencia práctica."
publico: "Usuarios curiosos de IA que ven límites en «tokens» y no saben qué significan."
hipotesis: "Formato 'contraintuitivo' en pilar 'conceptos': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje)."
gancho: "La IA no lee palabras: lee trozos llamados tokens."
duracion_objetivo: "35-55 s"
titulo: "Qué es un token: la IA no lee palabras, lee trozos"
titulos_alternativos:
  - "Tokens explicados: por qué la IA cuenta mal las letras"
  - "¿Cuántas palabras son 100 tokens?"
  - "El concepto de IA que debes entender: qué es un token"
criterio_titulo: "Define el concepto buscable (token) con el contraste que sorprende (no lee palabras)."
descripcion: |
  Un token es la unidad de texto que procesa un modelo: puede ser una palabra, una parte de una palabra o un carácter. Según la ayuda de OpenAI, en inglés 100 tokens equivalen a unas 75 palabras; la equivalencia varía según el idioma y el modelo.
  Entre las explicaciones de por qué la IA falla al contar letras está que no ve letras sueltas, sino trozos.
cta: "Guárdalo y compártelo si usabas «token» sin saber qué era."
comentario_fijado: "Para contar letras o palabras con exactitud, usa una planilla o un contador de texto y no le preguntes a la IA."
hashtags: ["#IA", "#Tokens", "#GlosarioIA"]
palabras_clave: ["qué es un token", "tokens en inteligencia artificial", "cuántas palabras es un token", "ventana de contexto"]
escenas:
  - narracion: "La IA no lee palabras: lee trozos llamados *tokens*."
    visual:
      plantilla: hook
      datos: {kicker: "Glosario rápido", titulo: "La IA lee *tokens*, no palabras", sub: "Qué es un token"}
  - narracion: "Un token puede ser una palabra entera, una parte de una palabra o un solo carácter. Depende del idioma y del modelo."
    visual:
      plantilla: texto
      datos: {titulo: "Qué es un token", texto: "Un *trozo de texto*: una palabra, una parte de ella o un carácter."}
  - narracion: "Como referencia, según OpenAI, 100 tokens en inglés equivalen a unas 75 palabras. Siempre hay más tokens que palabras."
    visual:
      plantilla: barras
      datos:
        titulo: "Referencia en inglés (aprox.)"
        maximo: 100
        items:
          - {etiqueta: "Tokens", valor: 100, destacado: true}
          - {etiqueta: "Palabras", valor: 75}
        nota: "Aproximado, según la ayuda de OpenAI"
  - narracion: "Por eso contar letras puede fallar: el modelo no recibe letras sueltas, sino trozos. Para contar con exactitud, usa una planilla."
    visual:
      plantilla: cierre
      datos:
        titulo: "Trozos, no *letras*"
        puntos: ["Token = trozo de texto", "100 tokens ≈ 75 palabras en inglés", "Para contar, usa una planilla"]
        cta: "Guárdalo para entender los límites"
