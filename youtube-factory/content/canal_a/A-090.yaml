    titulo: "Turing, A. M. (1950) Computing Machinery and Intelligence (Mind, copia en archivo de Southampton)"
    fecha_consulta: 2026-10-11
    respalda: "Artículo publicado en Mind en 1950 que reemplaza la pregunta '¿pueden pensar las máquinas?' por el juego de la imitación."
    cifras: [1950]
  - url: "https://plato.stanford.edu/archives/spr2004/entries/turing-test/"
    titulo: "The Turing Test (Stanford Encyclopedia of Philosophy, versión archivada 2004)"
    fecha_consulta: 2026-10-11
    respalda: "Turing creía que en unos cincuenta años sería posible programar computadoras para que un interrogador promedio no tuviera más de 70 % de probabilidad de identificar correctamente tras cinco minutos de preguntas."
    cifras: [70]
  - url: "https://zoo.cs.yale.edu/classes/cs458/materials/minds-brains-and-programs.pdf"
    titulo: "Searle, J. (1980) Minds, Brains, and Programs (Behavioral and Brain Sciences)"
    fecha_consulta: 2026-10-11
    respalda: "Searle sostiene que ejecutar un programa nunca es por sí solo condición suficiente de comprensión (intencionalidad), aunque la máquina supere el test de Turing."
    cifras: [1980]
riesgos:
