  El resumen con IA sirve para tener una idea general o decidir si un texto te interesa. El índice y la lectura de las secciones clave sirven cuando importan cifras, plazos o condiciones, como en un contrato.
  La regla del video es un criterio práctico, no una norma. Si el documento es importante, lee las secciones clave completas.
