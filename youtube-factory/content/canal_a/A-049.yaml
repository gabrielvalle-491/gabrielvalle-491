    cifras: [2025, 170, 92, 78, 40]
  - url: "https://www.weforum.org/publications/the-future-of-jobs-report-2025/digest/"
    titulo: "The Future of Jobs Report 2025 - Digest (Foro Económico Mundial)"
    fecha_consulta: 2026-10-11
