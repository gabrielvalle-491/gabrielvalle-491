  - url: "https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices"
    titulo: "Prompting best practices (Claude Platform Docs, Anthropic)"
    fecha_consulta: 2026-10-15
    respalda: "La guía de Anthropic indica que Claude responde bien a instrucciones claras y explícitas, y que asignar un rol, incluso con una sola frase, orienta el comportamiento y el tono de la respuesta."
  - url: "https://help.openai.com/en/articles/4936848-how-do-i-create-a-good-prompt-for-an-ai-model"
