    respalda: "ELIZA fue un programa de conversación creado por Joseph Weizenbaum entre 1964 y 1966; comparaba la entrada con reglas para generar respuestas, imitaba a un psicoterapeuta rogeriano y no poseía inteligencia real."
    cifras: [1964, 1966]
  - url: "https://en.wikipedia.org/wiki/ELIZA"
    titulo: "ELIZA (Wikipedia)"
    fecha_consulta: 2026-10-11
    respalda: "Los usuarios atribuyeron comprensión y emociones al programa (conocido luego como efecto ELIZA); el guion DOCTOR devolvía las palabras del usuario como preguntas."
  - url: "https://plato.stanford.edu/entries/turing-test/"
    titulo: "The Turing Test (Stanford Encyclopedia of Philosophy)"
    fecha_consulta: 2026-10-11
    respalda: "Programas poco inteligentes como ELIZA pueden parecer inteligentes a observadores comunes durante periodos prolongados."
