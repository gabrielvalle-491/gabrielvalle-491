id: A-021
canal: canal_a
fecha: 2026-11-08
formato: short
serie: Caso pyme
episodio: "#06"
pilar: negocio
tipo_editorial: caso_practico
idea: "Una secuencia de bienvenida de cinco correos (días 1, 3, 7, 14 y 30) con un objetivo distinto por día, redactada con ayuda de la IA y revisada por la persona."
objetivo: "Dar una estructura reutilizable de comunicación posventa para pymes y mostrar cómo pedirle borradores a la IA correo por correo."
publico: "Dueños de pequeños negocios y encargados de atención al cliente que no saben qué escribir después de una venta."
hipotesis: "Formato 'caso_practico' en pilar 'negocio': rendimiento frente a la media del pilar (aplicar lo aprendido en la fase de aprendizaje)."
gancho: "¿Qué le escribes a un cliente nuevo después de comprar?"
duracion_objetivo: "35-55 s"
titulo: "Bienvenida a clientes: qué decir en 5 correos"
titulos_alternativos:
  - "5 correos para el primer mes de un cliente nuevo"
  - "Secuencia de bienvenida con IA: día 1, 3, 7, 14 y 30"
  - "Después de la venta: el plan de correos que casi nadie hace"
criterio_titulo: "Promete una estructura concreta y fácil de visualizar (5 correos) con una palabra buscable ('bienvenida a clientes')."
descripcion: |
  Una secuencia simple de cinco correos para el primer mes: día 1 agradecer y explicar qué sigue; día 3 un consejo para empezar; día 7 preguntar cómo va; día 14 compartir un recurso útil; día 30 pedir opinión y ofrecer el siguiente paso.
  La IA redacta el borrador, tú lo revisas. Envía solo a quien aceptó recibir mensajes.
cta: "Guárdalo para tu próximo cliente."
comentario_fijado: "Prompt para cada correo: Escribe el correo del día [NÚMERO] de bienvenida para clientes de [NEGOCIO]. Objetivo: [OBJETIVO DEL DÍA]. Máximo 8 líneas. Tono cercano, sin promesas exageradas."
hashtags: ["#Pymes", "#IA", "#Emprendedores"]
palabras_clave: ["correos de bienvenida", "secuencia de correos clientes", "email para clientes nuevos", "IA para negocios"]
escenas:
  - narracion: "¿Qué le escribes a un cliente nuevo después de comprar? Cinco correos, cinco momentos."
    visual:
      plantilla: hook
      datos: {kicker: "Caso pyme", titulo: "Cliente nuevo: *5 correos* en un mes", sub: "Qué decir y cuándo"}
  - narracion: "El día 1, agradece y explica qué sigue. El día 3, envía un consejo para empezar a usar lo que compró. El día 7, pregunta cómo va. El día 14, comparte un recurso útil. Y el día 30, pide su opinión y ofrece el siguiente paso."
    visual:
      plantilla: timeline
      datos:
        titulo: "Primer mes del *cliente*"
        eventos:
          - {fecha: "Día 1", texto: "Gracias y qué sigue"}
          - {fecha: "Día 3", texto: "Un consejo para empezar"}
          - {fecha: "Día 7", texto: "¿Cómo te va?"}
          - {fecha: "Día 14", texto: "Un recurso útil"}
          - {fecha: "Día 30", texto: "Tu opinión y siguiente paso"}
  - narracion: "Pídele a la IA el borrador de cada correo, uno por vez. Tú le das el objetivo del día."
    visual:
      plantilla: prompt
      datos:
        etiqueta: "Plantilla de prompt"
        texto: "Escribe el correo del día [NÚMERO] de bienvenida para clientes de [NEGOCIO]. Objetivo: [OBJETIVO DEL DÍA]. Máximo 8 líneas. Tono cercano, sin promesas exageradas."
  - narracion: "Revisa cada borrador y ajústalo a tu voz. Y envía solo a quien aceptó recibir tus mensajes."
    visual:
      plantilla: cierre
      datos:
        titulo: "Un objetivo por *correo*"
        puntos: ["La IA redacta el borrador", "Tú lo revisas y lo firmas", "Solo a quien aceptó recibirlo"]
        cta: "Guárdalo para tu próximo cliente"
fuentes:
  - calculo: "[1, 3, 7, 14, 30]"
    respalda: "Días de envío propuestos como estructura ilustrativa de la secuencia; no provienen de un estudio ni de una estadística."
riesgos:
  derechos: "bajo — estructura y prompt creados por el canal"
  exactitud: "bajo — es una propuesta de estructura, no un dato; no se promete ningún resultado de negocio"
  monetizacion: "bajo — contenido educativo para negocios"
recursos:
  - {nombre: "Música y efectos originales generados por la fábrica", licencia: "propia"}
declaracion_sintetica:
  decision: "declarar"
  motivo: "Voz sintética realista; gráficos no realistas. Se declara por prudencia."
